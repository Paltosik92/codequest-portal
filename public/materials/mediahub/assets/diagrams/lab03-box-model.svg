<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, Arial, sans-serif" font-size="15" role="img" aria-label="Блочная модель карточки: margin, border, padding, content" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="360" fill="#10151d"/>
  <rect x="30" y="30" width="420" height="300" fill="#3b2f1e" stroke="#c9a46a" stroke-dasharray="6 4"/>
  <text x="42" y="52" fill="#e8c88f">margin — внешний отступ (прозрачный)</text>
  <rect x="70" y="70" width="340" height="230" fill="#344355"/>
  <text x="82" y="92" fill="#f0f5fa">border — рамка (1px)</text>
  <rect x="90" y="100" width="300" height="180" fill="#19212d"/>
  <text x="102" y="122" fill="#a9b8c8">padding — внутренний отступ (12px)</text>
  <rect x="120" y="135" width="240" height="120" fill="#1f5148" stroke="#64dfc5"/>
  <text x="240" y="190" fill="#f0f5fa" text-anchor="middle">content</text>
  <text x="240" y="212" fill="#a9b8c8" text-anchor="middle">обложка, название, цена</text>
  <g fill="#f0f5fa">
    <text x="480" y="70" font-weight="700">Ширина карточки width: 220px</text>
    <text x="480" y="110" fill="#64dfc5" font-weight="700">box-sizing: border-box</text>
    <text x="480" y="134">220 = рамка + padding + content</text>
    <text x="480" y="158">content = 220 − 2·1 − 2·12 = 194px</text>
    <text x="480" y="208" fill="#ffb1b8" font-weight="700">box-sizing: content-box</text>
    <text x="480" y="232">(так браузер считает по умолчанию)</text>
    <text x="480" y="256">content = 220px, а вся карточка</text>
    <text x="480" y="280">220 + 2·12 + 2·1 = 246px</text>
  </g>
</svg>
