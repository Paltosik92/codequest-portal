<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" font-family="Segoe UI, Arial, sans-serif" font-size="14" role="img" aria-label="Flexbox раскладывает элементы вдоль одной оси, Grid раскладывает их по строкам и колонкам" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64dfc5"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b6f36a"/></marker>
  </defs>
  <rect width="860" height="390" fill="#10151d"/>
  <text x="30" y="36" fill="#f0f5fa" font-size="18" font-weight="700">Flexbox — одна ось</text>
  <text x="30" y="58" fill="#a9b8c8">header { display: flex; }</text>
  <rect x="30" y="80" width="380" height="90" rx="12" fill="#19212d" stroke="#344355"/>
  <rect x="44" y="105" width="90" height="40" rx="8" fill="#222e3d" stroke="#64dfc5"/>
  <text x="89" y="130" fill="#f0f5fa" text-anchor="middle">логотип</text>
  <rect x="246" y="105" width="150" height="40" rx="8" fill="#222e3d" stroke="#64dfc5"/>
  <text x="321" y="130" fill="#f0f5fa" text-anchor="middle">nav</text>
  <line x1="44" y1="196" x2="396" y2="196" stroke="#64dfc5" stroke-width="2" marker-end="url(#a)"/>
  <text x="44" y="218" fill="#64dfc5">главная ось → justify-content: space-between</text>
  <line x1="424" y1="84" x2="424" y2="164" stroke="#b6f36a" stroke-width="2" marker-end="url(#b)"/>
  <text x="30" y="244" fill="#b6f36a">поперечная ось ↓ align-items: center</text>
  <text x="30" y="280" fill="#a9b8c8">Подходит для «строки» элементов:</text>
  <text x="30" y="302" fill="#a9b8c8">шапка, меню, ценник, ряд кнопок.</text>
  <text x="30" y="324" fill="#a9b8c8">flex-direction: column — ось вниз.</text>

  <text x="470" y="36" fill="#f0f5fa" font-size="18" font-weight="700">Grid — строки и колонки</text>
  <text x="470" y="58" fill="#a9b8c8">.catalog-grid { display: grid; }</text>
  <rect x="470" y="80" width="360" height="200" rx="12" fill="#19212d" stroke="#344355"/>
  <g fill="#222e3d" stroke="#64dfc5">
    <rect x="484" y="94" width="72" height="80" rx="6"/><rect x="570" y="94" width="72" height="80" rx="6"/>
    <rect x="656" y="94" width="72" height="80" rx="6"/><rect x="742" y="94" width="72" height="80" rx="6"/>
    <rect x="484" y="188" width="72" height="80" rx="6"/><rect x="570" y="188" width="72" height="80" rx="6"/>
  </g>
  <rect x="742" y="188" width="72" height="80" rx="6" fill="none" stroke="#344355" stroke-dasharray="4 4"/>
  <rect x="656" y="188" width="72" height="80" rx="6" fill="none" stroke="#344355" stroke-dasharray="4 4"/>
  <text x="470" y="306" fill="#a9b8c8">grid-template-columns: repeat(4, 1fr)</text>
  <text x="470" y="328" fill="#a9b8c8">→ 4 равные колонки, карточки встают</text>
  <text x="470" y="350" fill="#a9b8c8">по ячейкам слева направо, сверху вниз;</text>
  <text x="470" y="372" fill="#a9b8c8">gap — промежутки между ячейками</text>
</svg>
