<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="Segoe UI, Arial, sans-serif" font-size="14" role="img" aria-label="Путь запроса через сервер PixelPort: охрана папки server, файл по умолчанию, статические файлы, маршрут /api/games, иначе 404" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64dfc5"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff8a8a"/></marker></defs>
  <rect width="880" height="360" fill="#10151d"/>
  <g font-weight="700" fill="#f0f5fa">
    <rect x="20" y="40" width="120" height="64" rx="12" fill="#222e3d" stroke="#344355"/><text x="80" y="70" text-anchor="middle">Браузер</text>
    <rect x="180" y="40" width="140" height="64" rx="12" fill="#19212d" stroke="#344355"/><text x="250" y="68" text-anchor="middle">app.Use(…)</text>
    <rect x="360" y="40" width="140" height="64" rx="12" fill="#19212d" stroke="#344355"/><text x="430" y="68" text-anchor="middle">DefaultFiles</text>
    <rect x="540" y="40" width="140" height="64" rx="12" fill="#19212d" stroke="#344355"/><text x="610" y="68" text-anchor="middle">StaticFiles</text>
    <rect x="720" y="40" width="120" height="64" rx="12" fill="#1f5148" stroke="#64dfc5"/><text x="780" y="68" text-anchor="middle">MapGet</text>
  </g>
  <g fill="#a9b8c8" font-size="12.5">
    <text x="80" y="90" text-anchor="middle">GET /…</text>
    <text x="250" y="90" text-anchor="middle">охрана /server</text>
    <text x="430" y="90" text-anchor="middle">/ → /index.html</text>
    <text x="610" y="90" text-anchor="middle">файл есть в папке?</text>
    <text x="780" y="90" text-anchor="middle">/api/games</text>
  </g>
  <g stroke="#64dfc5" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M140 72 L175 72"/><path d="M320 72 L355 72"/><path d="M500 72 L535 72"/><path d="M680 72 L715 72"/>
    <path d="M610 108 L610 175"/><path d="M780 108 L780 175"/>
  </g>
  <g stroke="#ff8a8a" stroke-width="2" fill="none" marker-end="url(#r)">
    <path d="M250 108 L250 175"/><path d="M840 72 C 868 72, 868 285, 842 285"/>
  </g>
  <g font-size="13">
    <rect x="170" y="180" width="160" height="56" rx="10" fill="#2a1d22" stroke="#ff8a8a"/>
    <text x="250" y="204" text-anchor="middle" fill="#ffb3b3" font-weight="700">404</text>
    <text x="250" y="224" text-anchor="middle" fill="#a9b8c8">/server/appsettings.json</text>
    <rect x="522" y="180" width="176" height="56" rx="10" fill="#19212d" stroke="#64dfc5"/>
    <text x="610" y="204" text-anchor="middle" fill="#f0f5fa" font-weight="700">200 + файл</text>
    <text x="610" y="224" text-anchor="middle" fill="#a9b8c8">index.html, css, js…</text>
    <rect x="712" y="180" width="128" height="56" rx="10" fill="#19212d" stroke="#64dfc5"/>
    <text x="776" y="204" text-anchor="middle" fill="#f0f5fa" font-weight="700">200 + JSON</text>
    <text x="776" y="224" text-anchor="middle" fill="#a9b8c8">список игр</text>
    <rect x="640" y="265" width="200" height="40" rx="10" fill="#2a1d22" stroke="#ff8a8a"/>
    <text x="740" y="290" text-anchor="middle" fill="#ffb3b3" font-weight="700">ничего не подошло → 404</text>
  </g>
  <text x="20" y="342" fill="#a9b8c8" font-size="13">Запрос идёт слева направо. Кто ответил — дальше запрос не передаёт.</text>
</svg>
