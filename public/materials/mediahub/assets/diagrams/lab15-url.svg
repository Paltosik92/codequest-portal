<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="Segoe UI, Arial, sans-serif" font-size="14" role="img" aria-label="Части адреса запроса: схема, хост и порт, путь с параметром маршрута, строка запроса с параметрами" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="250" fill="#10151d"/>
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="700">
    <text y="70"><tspan x="30" fill="#a9b8c8">http://</tspan><tspan x="110" fill="#f0f5fa">localhost:5080</tspan><tspan x="272" fill="#64dfc5">/api/games/</tspan><tspan x="400" fill="#b6f36a">3</tspan></text>
    <text y="170"><tspan x="30" fill="#a9b8c8">http://</tspan><tspan x="110" fill="#f0f5fa">localhost:5080</tspan><tspan x="272" fill="#64dfc5">/api/games</tspan><tspan x="392" fill="#ffd27a">?genre=Гонки&amp;sort=price-asc</tspan></text>
  </g>
  <g stroke-width="2" fill="none">
    <path d="M30 80 L100 80" stroke="#a9b8c8"/>
    <path d="M110 80 L265 80" stroke="#f0f5fa"/>
    <path d="M272 80 L400 80" stroke="#64dfc5"/>
    <path d="M400 80 L413 80" stroke="#b6f36a"/>
    <path d="M30 180 L100 180" stroke="#a9b8c8"/>
    <path d="M110 180 L265 180" stroke="#f0f5fa"/>
    <path d="M272 180 L385 180" stroke="#64dfc5"/>
    <path d="M392 180 L715 180" stroke="#ffd27a"/>
  </g>
  <g font-size="13" fill="#a9b8c8">
    <text x="65" y="100" text-anchor="middle">схема</text>
    <text x="187" y="100" text-anchor="middle">хост и порт</text>
    <text x="336" y="100" text-anchor="middle" fill="#64dfc5">путь</text>
    <text x="440" y="100" fill="#b6f36a">← параметр маршрута {id}: одна игра, часть адреса</text>
    <text x="65" y="200" text-anchor="middle">схема</text>
    <text x="187" y="200" text-anchor="middle">хост и порт</text>
    <text x="328" y="200" text-anchor="middle" fill="#64dfc5">путь</text>
    <text x="553" y="200" text-anchor="middle" fill="#ffd27a">строка запроса: необязательные параметры</text>
  </g>
  <text x="30" y="30" fill="#f0f5fa" font-weight="700">Из чего состоит адрес запроса</text>
  <text x="30" y="236" fill="#a9b8c8" font-size="13">После «?» — пары «имя=значение», разделённые «&amp;». Порядок не важен, любую пару можно не указывать.</text>
</svg>
