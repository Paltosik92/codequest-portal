<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="Segoe UI, Arial, sans-serif" font-size="14" role="img" aria-label="Схема базы каталога: жанры, игры, теги и связующая таблица игра-тег" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="430" fill="#10151d"/>
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="13">
    <!-- genres -->
    <rect x="30" y="40" width="190" height="96" rx="10" fill="#19212d" stroke="#344355"/>
    <rect x="30" y="40" width="190" height="30" rx="10" fill="#222e3d"/>
    <text x="45" y="61" fill="#f0f5fa" font-weight="700" font-family="Segoe UI, Arial, sans-serif" font-size="15">genres</text>
    <text x="45" y="93" fill="#ffd27a">🔑 id</text>
    <text x="45" y="118" fill="#f0f5fa">name <tspan fill="#a9b8c8">UNIQUE</tspan></text>
    <!-- games -->
    <rect x="300" y="40" width="270" height="296" rx="10" fill="#19212d" stroke="#64dfc5"/>
    <rect x="300" y="40" width="270" height="30" rx="10" fill="#1f5148"/>
    <text x="315" y="61" fill="#f0f5fa" font-weight="700" font-family="Segoe UI, Arial, sans-serif" font-size="15">games</text>
    <text x="315" y="93" fill="#ffd27a">🔑 id</text>
    <text x="315" y="118" fill="#f0f5fa">slug <tspan fill="#a9b8c8">UNIQUE</tspan></text>
    <text x="315" y="143" fill="#f0f5fa">title</text>
    <text x="315" y="168" fill="#9cdcfe">🔗 genre_id → genres</text>
    <text x="315" y="193" fill="#f0f5fa">developer</text>
    <text x="315" y="218" fill="#f0f5fa">release_year <tspan fill="#a9b8c8">1970–2100</tspan></text>
    <text x="315" y="243" fill="#f0f5fa">price <tspan fill="#a9b8c8">≥ 0</tspan></text>
    <text x="315" y="268" fill="#f0f5fa">discount_percent <tspan fill="#a9b8c8">0–90</tspan></text>
    <text x="315" y="293" fill="#f0f5fa">rating <tspan fill="#a9b8c8">0–100</tspan></text>
    <text x="315" y="318" fill="#f0f5fa">description</text>
    <!-- game_tags -->
    <rect x="650" y="40" width="220" height="96" rx="10" fill="#19212d" stroke="#344355"/>
    <rect x="650" y="40" width="220" height="30" rx="10" fill="#222e3d"/>
    <text x="665" y="61" fill="#f0f5fa" font-weight="700" font-family="Segoe UI, Arial, sans-serif" font-size="15">game_tags</text>
    <text x="665" y="93" fill="#9cdcfe">🔑🔗 game_id → games</text>
    <text x="665" y="118" fill="#9cdcfe">🔑🔗 tag_id → tags</text>
    <!-- tags -->
    <rect x="650" y="230" width="220" height="96" rx="10" fill="#19212d" stroke="#344355"/>
    <rect x="650" y="230" width="220" height="30" rx="10" fill="#222e3d"/>
    <text x="665" y="251" fill="#f0f5fa" font-weight="700" font-family="Segoe UI, Arial, sans-serif" font-size="15">tags</text>
    <text x="665" y="283" fill="#ffd27a">🔑 id</text>
    <text x="665" y="308" fill="#f0f5fa">name <tspan fill="#a9b8c8">UNIQUE</tspan></text>
  </g>
  <g stroke="#64dfc5" stroke-width="2" fill="none">
    <path d="M220 88 L300 163"/>
    <path d="M570 88 L650 88"/>
    <path d="M760 136 L760 230"/>
  </g>
  <g font-weight="700" font-size="15" fill="#64dfc5">
    <text x="228" y="84">1</text><text x="282" y="152">∞</text>
    <text x="578" y="82">1</text><text x="636" y="82">∞</text>
    <text x="768" y="156">∞</text><text x="768" y="224">1</text>
  </g>
  <g font-size="13" fill="#a9b8c8">
    <text x="30" y="395">🔑 первичный ключ — номер строки, уникален · 🔗 внешний ключ — ссылка на строку другой таблицы</text>
    <text x="30" y="418">«1 — ∞»: в одном жанре много игр, у игры один жанр. Игры и теги: «многие ко многим» через game_tags.</text>
  </g>
</svg>
