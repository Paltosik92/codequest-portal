<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="Segoe UI, Arial, sans-serif" font-size="14" role="img" aria-label="GitHub Flow в паре: две ветки от main, два pull request, ревью соседа, первый PR влит, вторая ветка подтягивает main и разрешает конфликт, затем второй PR влит" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="880" height="330" fill="#10151d"/>
  <g fill="none" stroke-width="3">
    <path d="M40 165 L840 165" stroke="#a9b8c8"/>
    <path d="M80 165 C 120 165, 120 70, 170 70 L470 70 C 520 70, 520 165, 540 165" stroke="#64dfc5"/>
    <path d="M80 165 C 120 165, 120 260, 170 260 L740 260 C 790 260, 790 165, 800 165" stroke="#c9a6ff"/>
    <path d="M540 165 C 580 165, 580 260, 640 260" stroke="#a9b8c8" stroke-dasharray="6 5"/>
  </g>
  <g stroke="#10151d" stroke-width="3">
    <circle cx="80" cy="165" r="11" fill="#a9b8c8"/>
    <circle cx="260" cy="70" r="10" fill="#64dfc5"/>
    <circle cx="260" cy="260" r="10" fill="#c9a6ff"/>
    <circle cx="540" cy="165" r="12" fill="#64dfc5"/>
    <circle cx="640" cy="260" r="12" fill="#ff8a8a"/>
    <circle cx="800" cy="165" r="12" fill="#c9a6ff"/>
  </g>
  <g font-weight="700" fill="#f0f5fa">
    <text x="40" y="150">main</text>
    <text x="80" y="198" text-anchor="middle" font-weight="400" fill="#a9b8c8">v0.3</text>
    <text x="180" y="50" fill="#64dfc5">feature/new-badge — студент 1</text>
    <text x="180" y="300" fill="#c9a6ff">feature/rating-words — студент 2</text>
  </g>
  <g fill="#a9b8c8" font-size="13">
    <text x="250" y="98" text-anchor="middle">коммит «новинка»</text>
    <text x="230" y="240" text-anchor="middle">коммит «оценка словами»</text>
  </g>
  <g font-size="13">
    <rect x="330" y="50" width="130" height="40" rx="10" fill="#19212d" stroke="#64dfc5"/>
    <text x="395" y="68" text-anchor="middle" fill="#f0f5fa" font-weight="700">PR #1</text>
    <text x="395" y="83" text-anchor="middle" fill="#a9b8c8">ревью студента 2</text>
    <rect x="330" y="240" width="130" height="40" rx="10" fill="#19212d" stroke="#c9a6ff"/>
    <text x="395" y="258" text-anchor="middle" fill="#f0f5fa" font-weight="700">PR #2</text>
    <text x="395" y="273" text-anchor="middle" fill="#a9b8c8">ревью студента 1</text>
    <text x="540" y="140" text-anchor="middle" fill="#64dfc5" font-weight="700">1. Merge PR #1</text>
    <text x="660" y="225" text-anchor="middle" fill="#ff8a8a" font-weight="700">2. git merge main</text>
    <text x="660" y="300" text-anchor="middle" fill="#ffb3b3">конфликт → решён</text>
    <text x="800" y="140" text-anchor="middle" fill="#c9a6ff" font-weight="700">3. Merge PR #2</text>
  </g>
</svg>
